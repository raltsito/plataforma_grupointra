{% extends 'portafolio/_base.html' %}

{% block titulo %}
    Eliminar recurso
{% endblock %}

{% block contenido %}
    {% if mensaje_bloqueo %}
        <section class="card form">
            <p class="error">{{ mensaje_bloqueo }}</p>
            <p><a href="{% url volver %}">Volver</a></p>
        </section>
    {% else %}
    <section class="card form">
        <p>¿Eliminar “{{ item }}”?</p>

        <form method="post">
            {% csrf_token %}

            <button>Eliminar</button>
        </form>
    </section>
    {% endif %}
{% endblock %}
